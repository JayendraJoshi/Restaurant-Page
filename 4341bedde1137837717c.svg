<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700"/>
      <stop offset="50%" style="stop-color:#FFA500"/>
      <stop offset="100%" style="stop-color:#FF8C00"/>
    </linearGradient>
    
    <linearGradient id="redGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#DC143C"/>
      <stop offset="100%" style="stop-color:#8B0000"/>
    </linearGradient>
  </defs>
  
  <!-- Red background circle -->
  <circle cx="16" cy="16" r="16" fill="url(#redGradient)"/>
  
  <!-- Crown dome shape - centered -->
  <path d="M 16 10 
           Q 12 11, 8 14
           Q 7 16, 9 18
           Q 11 17, 13 17.5
           Q 14 16, 16 16.5
           Q 18 16, 19 17.5
           Q 21 17, 23 18
           Q 25 16, 24 14
           Q 20 11, 16 10 Z" 
        fill="url(#goldGradient)"/>
  
  <!-- Central crown jewel -->
  <ellipse cx="16" cy="13.5" rx="1.5" ry="2.5" fill="#FF1493"/>
  <ellipse cx="16" cy="13.5" rx="0.8" ry="1.3" fill="#FFFFFF" opacity="0.8"/>
  
  <!-- Side jewels -->
  <circle cx="12" cy="16" r="0.8" fill="#00CED1"/>
  <circle cx="20" cy="16" r="0.8" fill="#00CED1"/>
  <circle cx="9.5" cy="17" r="0.6" fill="#32CD32"/>
  <circle cx="22.5" cy="17" r="0.6" fill="#32CD32"/>
  
  <!-- Gold border -->
  <circle cx="16" cy="16" r="15" fill="none" stroke="#FFD700" stroke-width="0.8"/>
